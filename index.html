<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Schedules Directory</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 40px; background: #f8f9fa; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { border-bottom: 2px solid #24292e; padding-bottom: 10px; margin-top: 0; }
        .link { display: block; padding: 12px; margin: 8px 0; background: #f1f3f5; text-decoration: none; color: #0366d6; font-weight: bold; border-radius: 6px; }
        .link:hover { background: #e8f0fe; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 Current Board Op Schedules</h1>
    <h3>Email Time Off Requests to boardops@learfield.com</h3>
    <h3>Producer Hotline: 573-893-7477</h3>
    <div id="list">Scanning repository...</div>
</div>

<script>
    // --- CONFIGURATION ---
    const OWNER = 'LearfieldOps';
    const REPO = 'BOS';
    // ---------------------

    fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/Schedules`)
        .then(res => res.json())
        .then(files => {
            const list = document.getElementById('list');
            list.innerHTML = '';
            
            if (!Array.isArray(files)) {
                list.innerText = "No schedules found or folder is empty.";
                return;
            }

            files.forEach(file => {
                if (file.name.endsWith('.html')) {
                    const a = document.createElement('a');
                    // Relative path works perfectly on GitHub Pages
                    a.href = `Schedules/${file.name}`; 
                    a.className = 'link';
                    a.innerText = `📄 ${file.name.replace('.html', '').replace(/-/g, ' ')}`;
                    list.appendChild(a);
                }
            });
        })
        .catch(err => {
            document.getElementById('list').innerText = "Error loading files.";
        });
</script>
</body>
</html>
